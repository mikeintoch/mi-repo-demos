---
apiVersion: rhdh.redhat.com/v1alpha5
kind: Backstage
metadata:
  name: {{ .Values.rhdh.name }}
  namespace: {{ .Values.rhdh.namespace }}
  labels:
    app.kubernetes.io/name: backstage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  database:
    enableLocalDb: true
  application:
    dynamicPluginsConfigMapName: dynamic-plugins-rhdh
    appConfig:
      configMaps:
        - name: app-config-rhdh
      mountPath: /opt/app-root/src
    extraFiles:
      mountPath: /opt/app-root/etc
      configMaps:
        - name: rbac-policies
    extraEnvs:
      envs:
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
      secrets:
        - name: rhdh-secrets
        - name: kubernetes-sa-token
        - name: github-secrets
        - name: argocd-secrets
    replicas: 1
    route:
      enabled: true
      host: rhdh.{{ .Values.clusterDomain }}
      subdomain: {{ .Values.clusterDomain }}
  deployment:
    patch:
      spec:
        template:
          spec:
            automountServiceAccountToken: true
            volumes:
              - $patch: replace
                name: dynamic-plugins-root
                persistentVolumeClaim:
                  claimName: rhdh-dynamic-plugins-pvc
              - name: registry-policy
                configMap:
                  name: rhdh-registry-policy
            initContainers:
              - name: dynamic-plugins-init
                volumeMounts:
                  - name: registry-policy
                    mountPath: /etc/containers/policy.json
                    subPath: policy.json
                    readOnly: true