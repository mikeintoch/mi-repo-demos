---
kind: ConfigMap
apiVersion: v1
metadata:
  name: rbac-policies
  namespace: {{ .Values.rhdh.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  rbac-policy.csv: |-
    # api consumer: browses apis, requests access
    p, role:default/api-consumer, kuadrant.apiproduct.read.all, read, allow
    p, role:default/api-consumer, kuadrant.apiproduct.list, read, allow
    p, role:default/api-consumer, kuadrant.apikey.create, create, allow, apiproduct:*/*
    p, role:default/api-consumer, kuadrant.apikey.read.own, read, allow
    p, role:default/api-consumer, kuadrant.apikey.update.own, update, allow
    p, role:default/api-consumer, kuadrant.apikey.delete.own, delete, allow
    p, role:default/api-consumer, catalog.entity.read, read, allow
    p, role:default/api-consumer, kuadrant.planpolicy.list, read, allow
    p, role:default/api-consumer, kuadrant.authpolicy.list, read, allow
    p, role:default/api-consumer, kuadrant.ratelimitpolicy.list, read, allow
    p, role:default/api-consumer, kuadrant.httproute.list, read, allow

    # api owner: publishes apis they own, approves requests for their apis
    p, role:default/api-owner, kuadrant.httproute.list, read, allow
    p, role:default/api-owner, kuadrant.ratelimitpolicy.list, read, allow
    p, role:default/api-owner, kuadrant.authpolicy.list, read, allow
    p, role:default/api-owner, kuadrant.planpolicy.read, read, allow
    p, role:default/api-owner, kuadrant.planpolicy.list, read, allow
    p, role:default/api-owner, kuadrant.apiproduct.create, create, allow
    p, role:default/api-owner, kuadrant.apiproduct.read.all, read, allow
    p, role:default/api-owner, kuadrant.apiproduct.update.own, update, allow
    p, role:default/api-owner, kuadrant.apiproduct.delete.own, delete, allow
    p, role:default/api-owner, kuadrant.apiproduct.list, read, allow
    p, role:default/api-owner, kuadrant.apikey.create, create, allow, apiproduct:*/*
    p, role:default/api-owner, kuadrant.apikey.read.own, read, allow
    p, role:default/api-owner, kuadrant.apikey.update.own, update, allow
    p, role:default/api-owner, kuadrant.apikey.delete.own, delete, allow
    p, role:default/api-owner, kuadrant.apikey.approve, update, allow
    p, role:default/api-owner, catalog.entity.read, read, allow

    # api admin: platform engineers who manage all api products
    p, role:default/api-admin, kuadrant.planpolicy.read, read, allow
    p, role:default/api-admin, kuadrant.planpolicy.list, read, allow
    p, role:default/api-admin, kuadrant.authpolicy.list, read, allow
    p, role:default/api-admin, kuadrant.ratelimitpolicy.list, read, allow
    p, role:default/api-admin, kuadrant.apiproduct.create, create, allow
    p, role:default/api-admin, kuadrant.apiproduct.read.all, read, allow
    p, role:default/api-admin, kuadrant.apiproduct.update.all, update, allow
    p, role:default/api-admin, kuadrant.apiproduct.delete.all, delete, allow
    p, role:default/api-admin, kuadrant.apiproduct.list, read, allow
    p, role:default/api-admin, kuadrant.httproute.list, read, allow
    p, role:default/api-admin, kuadrant.apikey.create, create, allow, apiproduct:*/*
    p, role:default/api-admin, kuadrant.apikey.read.all, read, allow
    p, role:default/api-admin, kuadrant.apikey.update.all, update, allow
    p, role:default/api-admin, kuadrant.apikey.delete.all, delete, allow
    p, role:default/api-admin, kuadrant.apikey.approve, update, allow
    p, role:default/api-admin, catalog.entity.read, read, allow
    p, role:default/api-admin, policy.entity.read, read, allow
    p, role:default/api-admin, policy.entity.create, create, allow
    p, role:default/api-admin, policy.entity.update, update, allow
    p, role:default/api-admin, policy.entity.delete, delete, allow

    # assign groups to roles
    g, group:default/api-consumers, role:default/api-consumer
    g, group:default/api-owners, role:default/api-owner
    g, group:default/api-admins, role:default/api-admin

    # ==============================================================================
    # 1. PERMISOS PARA EL ROL: platformengineers (Administración total + Scaffolder + RBAC)
    # ==============================================================================
    # Catálogo
    p, role:default/platformengineers, catalog-entity, read, allow
    p, role:default/platformengineers, catalog.entity.create, create, allow
    p, role:default/platformengineers, catalog-entity, delete, allow
    p, role:default/platformengineers, catalog.location.read, read, allow
    p, role:default/platformengineers, catalog.location.create, create, allow
    p, role:default/platformengineers, catalog.location.delete, delete, allow

    # Scaffolder (Templates, Actions y Tasks)
    p, role:default/platformengineers, scaffolder.template.parameter.read, read, allow
    p, role:default/platformengineers, scaffolder.template.step.read, read, allow
    p, role:default/platformengineers, scaffolder.action.execute, use, allow
    p, role:default/platformengineers, scaffolder.task.create, create, allow
    p, role:default/platformengineers, scaffolder.task.cancel, use, allow
    p, role:default/platformengineers, scaffolder.task.read, read, allow

    # Gestión de RBAC (Necesario si ejecutan scaffolder-actions que crean roles/políticas)
    p, role:default/platformengineers, policy.entity, create, allow
    p, role:default/platformengineers, policy.entity, read, allow
    p, role:default/platformengineers, policy.entity, update, allow
    p, role:default/platformengineers, policy.entity, delete, allow

    # ==============================================================================
    # 2. PERMISOS PARA EL ROL: developers (Lectura de catálogo y ejecución de Templates)
    # ==============================================================================
    # Catálogo (Lectura y registro de nuevos componentes creados por el template)
    p, role:default/developers, catalog-entity, read, allow
    p, role:default/developers, catalog.entity.create, create, allow
    p, role:default/developers, catalog.location.read, read, allow
    p, role:default/developers, catalog.location.create, create, allow

    # Scaffolder (Ver y lanzar plantillas y sus acciones)
    p, role:default/developers, scaffolder.template.parameter.read, read, allow
    p, role:default/developers, scaffolder.template.step.read, read, allow
    p, role:default/developers, scaffolder.action.execute, use, allow
    p, role:default/developers, scaffolder.task.create, create, allow
    p, role:default/developers, scaffolder.task.cancel, use, allow
    p, role:default/developers, scaffolder.task.read, read, allow

    # ==============================================================================
    # 3. ASIGNACIÓN DE GRUPOS A ROLES
    # (Asegúrate de que el nombre del grupo coincida con el de tu catálogo/IDP)
    # ==============================================================================
    g, group:default/platformengineers, role:default/platformengineers
    g, group:default/developers, role:default/developers
