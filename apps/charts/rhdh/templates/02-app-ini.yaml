---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config-rhdh
  namespace: {{ .Values.rhdh.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  app-config.yaml: |
    permission:
      enabled: true
      rbac:
        policies-csv-file: /opt/app-root/etc/rbac-policy.csv
        policyFileReload: true
            
    app:
      title: Portal de Desarrolladores - RHDH Demo
      baseUrl: https://rhdh.{{ .Values.clusterDomain }}
    
    argocd:
      appLocatorMethods:
        - type: 'config'
          instances:
            - name: clusterargo
              url: "${ARGOCD_URL}"
              token: "${ARGOCD_TOKEN}"
      projectSettings:
        clusterResourceWhitelist:
          - group: ''
            kind: 'Namespace'
        namespaceResourceWhitelist:
          - group: 'apps'
            kind: 'Deployment'
          - group: ''
            kind: 'Service'
          - group: 'route.openshift.io'
            kind: 'Route'
    
    integrations:
      github:
        - host: github.com
          token: ${GITHUB_TOKEN}

    backend:
      baseUrl: https://rhdh.{{ .Values.clusterDomain }}
      cors:
        origin: https://rhdh.{{ .Values.clusterDomain }}

    signInPage: keycloak
    auth:
      session:
        secret: ${BACKEND_SECRET}
      environment: production
      providers:
        keycloak:
          production:
            prompt: auto
            baseUrl: https://sso.{{ .Values.clusterDomain }}
            realm: {{ .Values.keycloak.realmName }}
            clientId: ${AUTHENTICATION_OIDC_CLIENT_ID}
            clientSecret: ${AUTHENTICATION_OIDC_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: preferredUsernameMatchingUserEntityName
    
    catalog:
      locations:
      - type: url
        target: https://github.com/mydemodev/my-rhdh-templates/blob/main/templates.yaml
        rules:
        - allow:
          - Template
      rules:
        - allow: [Component, API, APIProduct, Location, Template, Domain, User, Group, System, Resource, Plugin, Package]
      providers:
        github:
          providerId:
            organization: mydemodev
          
        keycloakOrg:
          default:
            baseUrl: https://sso.{{ .Values.clusterDomain }}
            realm: {{ .Values.keycloak.realmName }}
            loginRealm: backstage
            clientId: backstage-plugin
            clientSecret: x8t7cYQnSYF8KZciSqD1y4NAZtCL9A3f
            schedule:
              frequency: { minutes: 2}
              timeout: { minutes: 1}
              initialDelay: { seconds: 15 }
            signIn:
              resolvers:
                - resolver: emailMatchingUserEntityProfileEmail

    kubernetes: null
    enabled:
      github: true
      argocd: true